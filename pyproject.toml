[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "service-management"
version = "0.1.0"
description = "Canonical Service Request and Case lifecycle foundations"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vercel-queue = ["vercel-queue==0.9.2"]
castalia-verifier = ["cryptography==50.0.1"]
catalog-validation = ["jsonschema==4.25.1"]

[project.scripts]
service-management = "service_management.__main__:main"
service-management-provider = "service_management.provider_worker:main"
service-management-provider-projection = "service_management.provider_projection_server:main"

[tool.setuptools.packages.find]
where = ["src"]
