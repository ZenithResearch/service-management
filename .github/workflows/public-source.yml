name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ZenithResearch/process-runtime
          ref: dd6b13d918c9d89228e0d618bd67f8c382d68492
          path: runtime-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python -m pip install --require-hashes -r runtime-source/requirements-ci.lock
      - run: python -m pip install --no-deps --no-build-isolation ./runtime-source
      - run: python -m pip install --no-build-isolation '.[vercel-queue,castalia-verifier]'
      - name: Build pinned native verifier for synthetic receiver tests
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 build --locked --manifest-path runtime-source/native/secs-verifier/Cargo.toml
      - name: Run full Python suite with Runtime recovery and native verification
        env:
          SERVICE_RUNTIME_COMMAND: '["python", "-I", "-m", "process_runtime"]'
          SERVICE_NATIVE_VERIFIER: ${{ github.workspace }}/runtime-source/native/secs-verifier/target/debug/process-runtime-secs-verifier
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Qualify wheel-installed normalized projections offline
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m venv --system-site-packages "$RUNNER_TEMP/service-ontology-wheel"
          "$RUNNER_TEMP/service-ontology-wheel/bin/python" -m pip install --no-deps --ignore-installed dist/service_management-*.whl
          python tools/qualify_ontology_install.py --python "$RUNNER_TEMP/service-ontology-wheel/bin/python"
