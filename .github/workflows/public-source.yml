name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ZenithResearch/process-runtime
          ref: 200179067b48ba9f2e6b3ebab8c6d7ce7164dc27
          path: runtime-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python -m pip install --require-hashes -r runtime-source/requirements-ci.lock
      - run: python -m pip install --no-deps --no-build-isolation ./runtime-source
      - run: python -m pip install --no-build-isolation '.[vercel-queue,castalia-verifier]'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
